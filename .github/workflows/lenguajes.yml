name: Lenguajes más usados

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarjeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar lenguajes.svg
        env:
          LENGUAJES_TOKEN: ${{ secrets.LENGUAJES_TOKEN }}
        run: python3 .github/scripts/lenguajes.py lenguajes.svg

      - name: Guardar si cambió
        run: |
          if git diff --quiet -- lenguajes.svg; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lenguajes.svg
          git commit -m "Actualiza lenguajes más usados"
          git push
