name: Lenguajes más usados

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarjeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar lenguajes.svg
        id: generar
        env:
          LENGUAJES_TOKEN: ${{ secrets.LENGUAJES_TOKEN }}
        run: python3 .github/scripts/lenguajes.py lenguajes.svg

      - name: Guardar si cambió
        run: |
          if git diff --quiet -- lenguajes.svg; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lenguajes.svg
          git commit -m "Actualiza lenguajes más usados"
          git push

      # Un run fallido le llega por correo al dueño del repo. Faltando 14 días
      # o menos, el run se marca como fallido a propósito (la tarjeta ya quedó
      # actualizada) para avisar con tiempo de renovar el token.
      - name: Avisar si el token está por vencer
        if: steps.generar.outputs.dias_token != '' && fromJSON(steps.generar.outputs.dias_token) <= 14
        run: |
          echo "::error::El token LENGUAJES_TOKEN vence el ${{ steps.generar.outputs.vence_token }} (faltan ${{ steps.generar.outputs.dias_token }} días). Genera uno nuevo y reemplaza el secret."
          exit 1
